<script>
(function() {
  const canvas = new fabric.Canvas('c', {
    width: __WIDTH__,
    height: __HEIGHT__,
    backgroundColor: "__BG__",
    selection: true,
    preserveObjectStacking: true,
    stopContextMenu: true,
  });

  // ---------- Load initial drawing ----------
  const initial = __INITIAL__;
  if (initial && initial.objects && initial.objects.length > 0) {
    canvas.loadFromJSON(initial, function() { canvas.renderAll(); });
  } else {
    canvas.renderAll();
  }

  // ---------- History ----------
  const history = [];
  let historyIndex = -1;
  let isRestoring = false;
  let suppressSync = true;   // don't push during initial load

  function snapshot() {
    if (isRestoring) return;
    const json = JSON.stringify(canvas.toJSON(['id','name','equipment_type','equip_height_3d']));
    history.splice(historyIndex + 1);
    history.push(json);
    historyIndex = history.length - 1;
    if (history.length > 50) { history.shift(); historyIndex--; }
  }

  function restore(idx) {
    if (idx < 0 || idx >= history.length) return;
    isRestoring = true;
    canvas.loadFromJSON(history[idx], function() {
      canvas.renderAll();
      isRestoring = false;
      syncToParent();
    });
    historyIndex = idx;
  }

  setTimeout(() => { snapshot(); suppressSync = false; }, 150);

  document.getElementById('btn-undo').onclick = () => restore(historyIndex - 1);
  document.getElementById('btn-redo').onclick = () => restore(historyIndex + 1);

  // ---------- Tool modes ----------
  let currentMode = "__MODE__";
  function setMode(mode) {
    currentMode = mode;
    canvas.isDrawingMode = false;
    canvas.selection = (mode === "transform");
    canvas.forEachObject(o => {
      o.selectable = (mode === "transform");
      o.evented = (mode === "transform");
    });
    canvas.discardActiveObject();
    canvas.renderAll();
    document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
    const id = { transform: 'btn-select', rect: 'btn-rect', circle: 'btn-circle',
                 line: 'btn-line', text: 'btn-text' }[mode];
    if (id) document.getElementById(id).classList.add('active');
    canvas.defaultCursor = mode === "transform" ? "default" : "crosshair";
  }
  setMode(currentMode);

  document.getElementById('btn-select').onclick = () => setMode('transform');
  document.getElementById('btn-rect').onclick   = () => setMode('rect');
  document.getElementById('btn-circle').onclick = () => setMode('circle');
  document.getElementById('btn-line').onclick   = () => setMode('line');
  document.getElementById('btn-text').onclick   = () => setMode('text');
  document.getElementById('btn-del').onclick = () => {
    canvas.getActiveObjects().forEach(o => canvas.remove(o));
    canvas.discardActiveObject();
    canvas.renderAll();
    snapshot();
    syncToParent();
  };

  // ---------- Drawing ----------
  let isDown = false, origX = 0, origY = 0, tempObj = null;

  canvas.on('mouse:down', function(opt) {
    if (currentMode === 'transform') return;
    if (opt.target) return;
    const p = canvas.getPointer(opt.e);
    isDown = true; origX = p.x; origY = p.y;

    if (currentMode === 'rect') {
      tempObj = new fabric.Rect({
        left: origX, top: origY, width: 1, height: 1,
        fill: "__FILL__", stroke: "__STROKE__", strokeWidth: __STROKE_W__,
        selectable: false, evented: false,
      });
      canvas.add(tempObj);
    } else if (currentMode === 'circle') {
      tempObj = new fabric.Circle({
        left: origX, top: origY, radius: 1,
        fill: "__FILL__", stroke: "__STROKE__", strokeWidth: __STROKE_W__,
        selectable: false, evented: false,
      });
      canvas.add(tempObj);
    } else if (currentMode === 'line') {
      tempObj = new fabric.Line([origX, origY, origX, origY], {
        stroke: "__STROKE__", strokeWidth: __STROKE_W__,
        selectable: false, evented: false,
      });
      canvas.add(tempObj);
    } else if (currentMode === 'text') {
      const t = new fabric.IText('Double-click to edit', {
        left: p.x, top: p.y, fontSize: 16, fill: "__STROKE__",
        fontFamily: 'system-ui, sans-serif',
      });
      canvas.add(t);
      canvas.setActiveObject(t);
      t.enterEditing(); t.selectAll();
      setMode('transform');
      snapshot();
      syncToParent();
    }
  });

  canvas.on('mouse:move', function(opt) {
    if (!isDown || !tempObj) return;
    const p = canvas.getPointer(opt.e);
    if (currentMode === 'rect') {
      tempObj.set({
        left: Math.min(p.x, origX), top: Math.min(p.y, origY),
        width: Math.abs(p.x - origX), height: Math.abs(p.y - origY),
      });
    } else if (currentMode === 'circle') {
      const r = Math.hypot(p.x - origX, p.y - origY);
      tempObj.set({ radius: r, left: origX - r, top: origY - r });
    } else if (currentMode === 'line') {
      tempObj.set({ x2: p.x, y2: p.y });
    }
    canvas.renderAll();
  });

  canvas.on('mouse:up', function() {
    if (currentMode === 'transform') return;
    if (!tempObj) { isDown = false; return; }
    const minSize = 8;
    if (currentMode === 'rect' &&
        (tempObj.width < minSize || tempObj.height < minSize)) {
      canvas.remove(tempObj);
    } else if (currentMode === 'circle' && tempObj.radius < minSize) {
      canvas.remove(tempObj);
    } else {
      tempObj.set({
        id: 'user_' + Math.random().toString(36).slice(2, 10),
        name: currentMode === 'rect' ? 'Rectangle'
            : currentMode === 'circle' ? 'Circle'
            : currentMode === 'line' ? 'Line' : 'Annotation',
        equipment_type: 'custom_box',
      });
      tempObj.set({ selectable: true, evented: true });
    }
    tempObj = null; isDown = false;
    canvas.renderAll();
    snapshot();
    syncToParent();
  });

  canvas.on('object:modified', function() { snapshot(); syncToParent(); });
  canvas.on('object:removed', function() { snapshot(); syncToParent(); });

  // ---------- LIVE SYNC: push state to parent URL ----------
  // Streamlit reads window.parent.location.search (st.query_params)
  // on rerun. We debounce so rapid drag events don't spam the parent.
  let syncTimer = null;
  function syncToParent() {
    if (suppressSync) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      try {
        const json = JSON.stringify(canvas.toJSON(['id','name','equipment_type','equip_height_3d']));
        const b64 = btoa(unescape(encodeURIComponent(json)));
        // Preserve other query params, replace canvas_state
        const url = new URL(window.parent.location.href);
        url.searchParams.set('canvas_state', b64);
        url.searchParams.set('canvas_ts', Date.now().toString());
        // Use replaceState to avoid polluting history
        window.parent.history.replaceState({}, '', url.toString());
        // Force a Streamlit rerun by dispatching a popstate
        window.parent.dispatchEvent(new PopStateEvent('popstate'));
      } catch (e) {
        console.warn('syncToParent failed', e);
      }
    }, 250); // debounce
  }
})();
</script>
